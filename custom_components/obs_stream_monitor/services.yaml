set_settings:
  name: OBS-Einstellungen setzen
  description: >-
    Setzt rohe OBS-Quellen- oder Filter-Einstellungen direkt aus einer
    Automatisierung oder einem Skript - dieselbe Funktion wie der
    Zahnrad-Dialog der "OBS Szenen-Baum"-Karte, nur als Service statt per
    Hand. Nur die angegebenen Felder werden geändert (Overlay/Merge), alle
    anderen Einstellungen der Quelle/des Filters bleiben wie sie sind.
  target:
    entity:
      integration: obs_stream_monitor
      domain: switch
  fields:
    settings:
      name: Einstellungen
      description: >-
        Die zu setzenden Felder als Objekt, z. B. {"text": "Jetzt live!"}
        für eine Textquelle oder {"key_color": 65280} für einen
        Chroma-Key-Filter. Die rohen, technischen Feldnamen stehen im
        Zahnrad-Dialog der Karte klein neben der jeweiligen Beschriftung.
      required: true
      example: '{"text": "Jetzt live!"}'
      selector:
        object:
